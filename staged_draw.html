<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Losowanie etapami — demo</title>
  <style>
    :root{
      --bg:#0f1724; --card:#0b1220; --accent:#07c; --muted:#94a3b8; --white:#ffffff;
      --big-font:clamp(48px, 10vw, 160px);
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#061020);font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
    .app{min-height:100%;display:flex;flex-direction:column}

    header{padding:12px 18px;color:var(--white);display:flex;align-items:center;gap:18px}
    .brand{font-weight:700;font-size:18px}

    .controls{display:flex;gap:12px;align-items:center}
    .controls input[type=number]{width:110px;padding:6px;border-radius:6px;border:1px solid #203040;background:#08121a;color:var(--white)}
    .controls input[type=text]{width:280px;padding:6px;border-radius:6px;border:1px solid #203040;background:#08121a;color:var(--white)}
    .controls button{padding:8px 12px;border-radius:8px;border:0;background:var(--accent);color:#012;cursor:pointer}
    .controls button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--white)}

    main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}

    /* video area */
    .stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    video#stageVideo{max-width:100%;max-height:100%;display:block;filter:brightness(0.95);}

    /* big number overlay */
    .big-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .big-number{
      font-weight:800;color:var(--white);text-shadow:0 6px 40px rgba(2,6,23,0.7);
      transform:scale(0.92);opacity:0;transition:opacity .25s ease,transform .35s cubic-bezier(.2,.9,.3,1);
      font-size:var(--big-font);line-height:0.9
    }
    .big-number.show{opacity:1;transform:scale(1)}

    /* bottom list */
    .history{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.35));padding:12px 18px;display:flex;align-items:center;justify-content:center}
    .history-list{display:flex;gap:10px;overflow:hidden;padding:6px 8px;border-radius:12px;background:#071423;border:1px solid rgba(255,255,255,0.03)}
    .token{min-width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#071e2b;color:var(--white);font-weight:700;font-size:18px;border:1px solid rgba(255,255,255,0.03)}

    /* small info panel */
    .info{position:absolute;top:12px;right:12px;background:rgba(2,6,23,0.6);padding:8px 10px;border-radius:8px;color:var(--muted);font-size:13px}

    /* responsive tweaks */
    @media (max-width:640px){
      .controls input[type=text]{width:160px}
      .token{min-width:44px;height:44px;font-size:16px}
    }
	@keyframes fakeDraw {
      0%   { transform: scale(0.9); opacity: 0; filter: blur(10px); }
      100%  { opacity: 1; filter: blur(0); }
      /*100% { transform: scale(1.1); opacity: 0; filter: blur(20px); }*/
    }
    
    .fake-anim {
      position:absolute;
      font-size:80px;
      font-weight:800;
      color:white;
      text-shadow:0 0 25px rgba(0,0,0,0.6);
      animation: fakeDraw 5.4s ease-out forwards;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Losowanie etapami — demo</div>
      <div class="controls">
        <label title="Wczytaj zakres liczb lub listę (np. 1-90 lub 1,2,5,7)">Wejście:
          <input id="inputNumbers" type="text" placeholder="1-90 or 5,12,23" value="1-90">
        </label>
        <label title="Ile sekund między kolejnymi losowaniami (max 900)">Interwał (s):
          <input id="intervalSec" type="number" min="1" max="900" value="10">
        </label>
        <button id="startBtn">Start</button>
        <button id="pauseBtn" class="ghost">Pause</button>
        <button id="forceBtn" class="ghost">Draw now</button>
        <button id="resetBtn" class="ghost">Reset</button>
      </div>
    </header>

    <main>
      <div class="stage">
        <!-- hidden video element that will play per-number clip -->
        <video id="stageVideo" playsinline muted></video>

        <!-- overlay shows big number after / during video -->
        <div class="big-overlay"><div id="bigNumber" class="big-number"></div></div>

        <div class="info" id="infoPanel">Idle — ready</div>
      </div>
    </main>

    <div class="history">
      <div class="history-list" id="historyList" aria-live="polite"></div>
    </div>
  </div>

  <script>
    // Simple staged drawer
    (function(){
      const inputEl = document.getElementById('inputNumbers');
      const intervalEl = document.getElementById('intervalSec');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const forceBtn = document.getElementById('forceBtn');
      const resetBtn = document.getElementById('resetBtn');
      const video = document.getElementById('stageVideo');
      const bigNumber = document.getElementById('bigNumber');
      const info = document.getElementById('infoPanel');
      const historyList = document.getElementById('historyList');

      let pool = []; // numbers still available
      let drawn = []; // drawn numbers order
      let timer = null; // countdown interval
      let remaining = 0; // seconds left
      let running = false;
      let paused = false;

      const MAX_HISTORY = 10;
      const SHOW_NUMBER_AFTER_MS = 3000; // show big number duration

      function parseInput(txt){
        txt = (txt||'').trim();
        if(!txt) return [];
        // allow comma-separated or range like 1-90, or mixed
        const parts = txt.split(/[ ,;]+/);
        const set = new Set();
        parts.forEach(p=>{
          if(!p) return;
          if(p.includes('-')){
            const [a,b] = p.split('-').map(x=>parseInt(x,10));
            if(Number.isFinite(a) && Number.isFinite(b)){
              const start = Math.min(a,b), end = Math.max(a,b);
              for(let i=start;i<=end;i++) set.add(i);
            }
          } else {
            const v = parseInt(p,10);
            if(Number.isFinite(v)) set.add(v);
          }
        });
        return Array.from(set).sort((a,b)=>a-b);
      }

      function resetAll(){
        stopTimer();
        pool = parseInput(inputEl.value);
        drawn = [];
        updateHistoryUI();
        bigNumber.classList.remove('show');
        video.pause(); video.removeAttribute('src'); video.load();
        running = false; paused=false;
        info.textContent = `Gotowe — ${pool.length} w puli`;
        startBtn.textContent = 'Start';
        pauseBtn.textContent = 'Pause';
      }

      function start(){
        if(running){ return; }
        if(pool.length===0){ info.textContent='Brak liczb w puli!'; return; }
        running = true; paused = false;
        remaining = clampInterval();
        startTimerTick();
        startBtn.textContent = 'Running';
        info.textContent = `Będzie losować co ${remaining}s — ${pool.length} dostępnych`;
      }

      function pauseToggle(){
        if(!running) return;
        paused = !paused;
        pauseBtn.textContent = paused ? 'Resume' : 'Pause';
        info.textContent = paused ? 'Zatrzymane' : 'Wznawianie';
      }

      function clampInterval(){
        let v = parseInt(intervalEl.value,10) || 10;
        if(v<1) v=1; if(v>900) v=900; // keep max ~15min
        intervalEl.value = v;
        return v;
      }

      function startTimerTick(){
        stopTimer();
        timer = setInterval(()=>{
          if(!running || paused) return;
          remaining -= 1;
          info.textContent = `Następne losowanie za ${remaining}s — ${pool.length} w puli`;
          if(remaining<=0){
            remaining = clampInterval();
            doDrawStage();
          }
        }, 1000);
      }

      function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }

      function doDrawStage(){
        if(pool.length===0){ info.textContent='Koniec puli — brak więcej liczb.'; running=false; startBtn.textContent='Start'; stopTimer(); return; }
        // pick next number deterministically: take a random element for demo but no replacement
        const idx = Math.floor(Math.random()*pool.length);
        const num = pool.splice(idx,1)[0];
        
        // play video associated with number
        playNumberClip(num).then(()=>{
          // after playback show big number for a moment
		  drawn.push(num);
          showBigNumber(num);
          setTimeout(()=>{updateHistoryUI()}, 1000);
        });
      }

      function playNumberClip(realNumber){
        return new Promise((resolve)=>{
          // spectacular fake spin animation
          const stage = document.querySelector('.stage');
          const spinEl = document.createElement('div');
          spinEl.className = 'fake-anim';
          stage.appendChild(spinEl);
      
          let t = 0;
          const duration = 5000; // total animation time
          const start = performance.now();
      
          function easeOutQuad(x){ return 1 - (1 - x) * (1 - x); }
      
          function frame(now){
            const progress = Math.min(1, (now - start) / duration);
            const eased = easeOutQuad(progress);
      
            // speed decreases over time
            const interval = 50 + eased * 50; // slows from 50ms to ~300ms
            if(now - t > interval){
              t = now;
              spinEl.textContent = Math.floor(Math.random()*101);
            }
      
            // flicker visual effect
            spinEl.style.opacity = 0.6 + Math.random()*0.4;
            spinEl.style.transform = `scale(${0.9 + Math.random()*0.2})`;
      
            if(progress < 1){ requestAnimationFrame(frame); }
            else {
              spinEl.remove();
              // after spin, play real clip
              const src = `videos/${realNumber}.mp4`;
              video.pause(); video.src = src; video.muted = true; video.playsInline = true;
              let resolved = false;
              const cleanup = ()=>{
                video.onplaying = null; video.onended = null; video.onerror = null;
                video.pause(); if(!resolved){ resolved=true; resolve(); }
              };
              video.onplaying = ()=>{ info.textContent = `Odtwarzanie klipu ${realNumber}`; };
              video.onended = ()=>cleanup();
              video.onerror = ()=>cleanup();
              setTimeout(()=>cleanup(),3000);
              const p = video.play(); if(p && p.catch) p.catch(()=>cleanup());
            }
          }
          requestAnimationFrame(frame);
        });
      };

//          // when video plays, wait for it to end
//          video.onplaying = ()=>{
//            info.textContent = `Odtwarzanie klipu ${n}`;
//          };
//
//          video.onended = ()=>{ cleanup(); };
//          video.onerror = ()=>{ /* fallback: no file */ cleanup(); };
//
//          // safety timeout: if video doesn't start in 3s, fallback immediately
//          const to = setTimeout(()=>{ if(!resolved){ cleanup(); } }, 3000);
//
//          // try to play (modern browsers require user gesture; Start must be clicked)
//          const p = video.play();
//          if(p && typeof p.then==='function'){
//            p.catch(()=>{ /* autoplay blocked, fallback */ cleanup(); });
//          }
//        });
//      }

      function showBigNumber(n){
        bigNumber.textContent = n;
        bigNumber.classList.add('show');
        setTimeout(()=> bigNumber.classList.remove('show'), SHOW_NUMBER_AFTER_MS);
      }

      function updateHistoryUI(){
        // show last MAX_HISTORY numbers from drawn
        historyList.innerHTML = '';
        const slice = drawn.slice(-MAX_HISTORY);
        slice.forEach(x=>{
          const el = document.createElement('div'); el.className='token'; el.textContent = x; historyList.appendChild(el);
        });
      }

      // forced draw immediately
      function forceDraw(){
        if(!running){ // if not running, start one draw immediately but do not start timer
          doDrawStage();
          return;
        }
        // if paused do nothing
        if(paused) return;
        // reset countdown and draw now
        remaining = clampInterval();
        doDrawStage();
      }

      // attach handlers
      startBtn.addEventListener('click', ()=>{ if(running) { /* stop? toggle? */ running=false; stopTimer(); startBtn.textContent='Start'; info.textContent='Zatrzymane'; } else start(); });
      pauseBtn.addEventListener('click', ()=> pauseToggle());
      forceBtn.addEventListener('click', ()=> forceDraw());
      resetBtn.addEventListener('click', ()=> resetAll());

      // initialize
      resetAll();

      // expose for debugging
      window._stagedDrawer = { resetAll, doDrawStage, forceDraw };
    })();
  </script>
</body>
</html>
